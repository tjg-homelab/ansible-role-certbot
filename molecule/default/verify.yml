---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Stat the Cloudflare DNS credentials file
      ansible.builtin.stat:
        path: /root/.secrets/certbot/cloudflare.ini
      register: certbot_creds_stat

    - name: Assert the DNS credentials file exists with 0600
      ansible.builtin.assert:
        that:
          - certbot_creds_stat.stat.exists
          - certbot_creds_stat.stat.isreg
          - certbot_creds_stat.stat.mode == "0600"

    - name: Stat the renewal service unit
      ansible.builtin.stat:
        path: /etc/systemd/system/certbot-renew.service
      register: certbot_service_stat

    - name: Stat the renewal timer unit
      ansible.builtin.stat:
        path: /etc/systemd/system/certbot-renew.timer
      register: certbot_timer_stat

    - name: Assert both renewal units exist
      ansible.builtin.assert:
        that:
          - certbot_service_stat.stat.exists
          - certbot_timer_stat.stat.exists

    - name: Read the renewal service unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/certbot-renew.service
      register: certbot_service_content

    - name: Assert the service runs certbot renew
      ansible.builtin.assert:
        that:
          - "'certbot renew --quiet' in (certbot_service_content.content | b64decode)"

    - name: Assert the deploy hook is wired into the renewal ExecStart
      # Real end-to-end coverage (does the hook actually fire on a fresh
      # issuance?) needs real certonly issuance, which this scenario
      # deliberately skips (no Let's Encrypt in CI). This at least locks in
      # that the variable reaches the unit file correctly.
      ansible.builtin.assert:
        that:
          - "'--deploy-hook touch /tmp/certbot-deploy-hook-configured' in (certbot_service_content.content | b64decode)"

    - name: Stat the renewal timer enablement symlink
      ansible.builtin.stat:
        path: /etc/systemd/system/timers.target.wants/certbot-renew.timer
      register: certbot_timer_wants

    - name: Assert the renewal timer is enabled
      ansible.builtin.assert:
        that:
          - certbot_timer_wants.stat.exists

    # --- AN-43: self-signed bootstrap breaks the bare-host deadlock ---
    # On a bare host, HTTP-01 needs a web server on :80, but the web server will
    # not start without the cert it is asked to serve. The placeholder lets it
    # start; the marker guarantees a real issuance still happens afterwards.
    - name: Stat the bootstrap placeholder material
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/molecule-bootstrap/{{ item }}"
      register: certbot_verify_bootstrap
      loop:
        - fullchain.pem
        - privkey.pem
        - .ansible-selfsigned-bootstrap

    - name: Assert the placeholder and its marker exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "missing {{ item.item }} — nginx would not be able to start"
        quiet: true
      loop: "{{ certbot_verify_bootstrap.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the placeholder certificate
      community.crypto.x509_certificate_info:
        path: /etc/letsencrypt/live/molecule-bootstrap/fullchain.pem
      register: certbot_verify_placeholder

    - name: Assert it really is self-signed, and short-lived
      # Self-signed means issuer == subject. Short expiry is deliberate: if a
      # placeholder ever escapes to production it should fail loudly and soon,
      # not quietly serve an untrusted cert for 90 days.
      ansible.builtin.assert:
        that:
          - certbot_verify_placeholder.issuer == certbot_verify_placeholder.subject
        quiet: true

    - name: Assert the private key is not world-readable
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/molecule-bootstrap/privkey.pem
      register: certbot_verify_key

    - name: Check key permissions
      ansible.builtin.assert:
        that:
          - certbot_verify_key.stat.mode == '0600'
        fail_msg: "placeholder key is {{ certbot_verify_key.stat.mode }}, expected 0600"
        quiet: true
