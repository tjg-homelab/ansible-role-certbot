---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: certbot-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
  - name: certbot-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
  - name: certbot-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      remote_tmp: /var/tmp/.ansible/tmp
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        # snapd + certbot + Let's Encrypt don't run inside a CI container, so test
        # the config surface (creds file, renewal units, timer) and skip the snap
        # install and the real certonly issuance.
        certbot_manage_install: false
        certbot_manage_certificates: false
        certbot_domains:
          - example.com
          - "*.example.com"
        certbot_challenge: dns-cloudflare
        certbot_dns_credentials_content: "dns_cloudflare_api_token = molecule-dummy-token"
        # AN-43: exercise the self-signed bootstrap. Real issuance stays off
        # (no Let's Encrypt from CI), which is exactly the state a bare host is
        # in before its web server exists — so this is the honest test of the
        # placeholder path.
        certbot_bootstrap_selfsigned: true
        certbot_cert_name: molecule-bootstrap
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
