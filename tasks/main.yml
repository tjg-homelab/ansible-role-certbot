---
- name: Assert supported OS
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] | lower == "debian"
    fail_msg: "certbot role supports Debian-family systems (Debian, Ubuntu)."

- name: Assert required certificate settings
  ansible.builtin.assert:
    that:
      - certbot_domains | length > 0
      - certbot_cert_name | length > 0
      - certbot_challenge in ["dns-cloudflare", "webroot"]
    fail_msg: >-
      Set certbot_domains (non-empty) and a valid certbot_challenge
      (dns-cloudflare | webroot).

# ---------- Install certbot via snap (certbot's recommended method) ----------
- name: Assert a supported install method
  ansible.builtin.assert:
    that:
      - certbot_install_method in ["snap", "apt"]
    fail_msg: "certbot_install_method must be 'snap' or 'apt', got '{{ certbot_install_method }}'"
    quiet: true
  when: certbot_manage_install | bool

# ---------- apt install path ----------
# For hosts where snap cannot run at all (container-based VPS: no squashfs).
- name: Install certbot from apt
  become: true
  ansible.builtin.apt:
    name: "{{ ['certbot'] + (['python3-certbot-dns-cloudflare'] if certbot_challenge == 'dns-cloudflare' else []) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - certbot_manage_install | bool
    - certbot_install_method == "apt"

- name: Install snapd
  become: true
  ansible.builtin.apt:
    name: snapd
    state: present
    update_cache: true
  when:
    - certbot_manage_install | bool
    - certbot_install_method == "snap"

- name: Ensure snap core is present
  become: true
  ansible.builtin.command: snap install core
  register: certbot_snap_core
  changed_when: "'already installed' not in (certbot_snap_core.stdout + certbot_snap_core.stderr)"
  when:
    - certbot_manage_install | bool
    - certbot_install_method == "snap"

- name: Install the certbot snap
  become: true
  ansible.builtin.command:
    cmd: "snap install {{ certbot_snap_name }} --classic"
    creates: "{{ certbot_bin }}"
  when:
    - certbot_manage_install | bool
    - certbot_install_method == "snap"

- name: Allow certbot to trust the root-run DNS plugin
  become: true
  ansible.builtin.command: "snap set {{ certbot_snap_name }} trust-plugin-with-root=ok"
  changed_when: false
  when:
    - certbot_manage_install | bool
    - certbot_install_method == "snap"
    - certbot_challenge == "dns-cloudflare"

- name: Check whether the Cloudflare DNS plugin snap is installed
  become: true
  ansible.builtin.command: snap list certbot-dns-cloudflare
  register: certbot_cf_plugin
  changed_when: false
  failed_when: false
  when:
    - certbot_manage_install | bool
    - certbot_install_method == "snap"
    - certbot_challenge == "dns-cloudflare"

- name: Install the Cloudflare DNS plugin snap
  become: true
  ansible.builtin.command: snap install certbot-dns-cloudflare
  changed_when: true
  when:
    - certbot_manage_install | bool
    - certbot_install_method == "snap"
    - certbot_challenge == "dns-cloudflare"
    - (certbot_cf_plugin.rc | default(1)) != 0

- name: Connect the Cloudflare DNS plugin to certbot
  become: true
  ansible.builtin.command: "snap connect {{ certbot_snap_name }}:plugin certbot-dns-cloudflare"
  changed_when: false
  when:
    - certbot_manage_install | bool
    - certbot_install_method == "snap"
    - certbot_challenge == "dns-cloudflare"

# ---------- Cloudflare DNS credentials (DNS-01 only) ----------
- name: Ensure DNS credentials directory exists
  become: true
  ansible.builtin.file:
    path: "{{ certbot_dns_credentials_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - certbot_challenge == "dns-cloudflare"
    - certbot_dns_credentials_content | length > 0

- name: Install Cloudflare DNS credentials
  become: true
  ansible.builtin.copy:
    dest: "{{ certbot_dns_credentials_path }}"
    content: "{{ certbot_dns_credentials_content }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - certbot_challenge == "dns-cloudflare"
    - certbot_dns_credentials_content | length > 0


# ---------- Self-signed bootstrap (breaks the bare-host deadlock) ----------
- name: Bootstrap a self-signed placeholder certificate
  when:
    - certbot_bootstrap_selfsigned | bool
    - not ansible_check_mode
  block:
    - name: Check whether the lineage already exists
      ansible.builtin.stat:
        path: "/etc/letsencrypt/live/{{ certbot_cert_name }}/fullchain.pem"
      register: certbot_lineage

    - name: Create the lineage directory
      ansible.builtin.file:
        path: "/etc/letsencrypt/live/{{ certbot_cert_name }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: not certbot_lineage.stat.exists

    - name: Generate the placeholder private key
      community.crypto.openssl_privatekey:
        path: "/etc/letsencrypt/live/{{ certbot_cert_name }}/privkey.pem"
        size: 2048
        mode: "0600"
      when: not certbot_lineage.stat.exists

    - name: Generate the placeholder certificate
      community.crypto.x509_certificate:
        path: "/etc/letsencrypt/live/{{ certbot_cert_name }}/fullchain.pem"
        privatekey_path: "/etc/letsencrypt/live/{{ certbot_cert_name }}/privkey.pem"
        provider: selfsigned
        selfsigned_not_after: "+30d"
        mode: "0644"
      when: not certbot_lineage.stat.exists

    - name: Mark the lineage as a placeholder
      # Without this the guard below would treat the self-signed file as a real
      # certificate and never issue — the site would serve an untrusted cert
      # indefinitely, which is worse than failing loudly.
      ansible.builtin.file:
        path: "/etc/letsencrypt/live/{{ certbot_cert_name }}/{{ certbot_bootstrap_marker }}"
        state: touch
        owner: root
        group: root
        mode: "0644"
      when: not certbot_lineage.stat.exists

# ---------- Initial issuance (guarded — no-op once a REAL cert exists) ----------
- name: Build the certonly command
  ansible.builtin.set_fact:
    certbot_certonly_cmd: >-
      {{ certbot_bin }} certonly --non-interactive --agree-tos
      --cert-name {{ certbot_cert_name }}
      {{ ('--email ' + certbot_email) if (certbot_email | length > 0) else '--register-unsafely-without-email' }}
      {{
        ('--dns-cloudflare --dns-cloudflare-credentials ' + certbot_dns_credentials_path +
         ' --dns-cloudflare-propagation-seconds ' + (certbot_dns_propagation_seconds | string))
        if certbot_challenge == 'dns-cloudflare'
        else ('--webroot -w ' + certbot_webroot_path)
      }}
      {{ certbot_domains | map('regex_replace', '^(.*)$', '-d \1') | join(' ') }}
      {{ (' --deploy-hook ' + certbot_deploy_hook) if (certbot_deploy_hook | length > 0) else '' }}
  when: certbot_manage_certificates | bool

- name: Check for a real certificate
  # `creates:` alone is not enough once a self-signed placeholder can occupy the
  # path: the guard has to distinguish a real lineage from a bootstrap one.
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ certbot_cert_name }}/{{ certbot_bootstrap_marker }}"
  register: certbot_bootstrap_flag
  when: certbot_manage_certificates | bool

- name: Check whether any certificate is present
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ certbot_cert_name }}/fullchain.pem"
  register: certbot_existing_cert
  when: certbot_manage_certificates | bool

# certbot REFUSES to issue into a live/ directory it did not create:
#   "live directory exists for <name>"
# The bootstrap placeholder occupies exactly that path, so it has to be cleared
# the moment real issuance is about to happen. Its whole job — letting the web
# server start so HTTP-01 can validate — is finished by this point.
#
# Removing it while nginx is running is safe: nginx holds the loaded certificate
# in memory and keeps serving until it is reloaded, which `--deploy-hook` on the
# certonly command above does immediately after a successful issuance.
#
# BUG FIXED HERE: `--deploy-hook` was previously wired ONLY into the renewal
# timer's `certbot renew --deploy-hook ...` (below) — this comment claimed the
# reload already happened here, but nothing actually told the *first* real
# issuance to run it. certbot itself honors --deploy-hook on `certonly` too
# (runs it once, immediately, for that invocation, same as on a renewal), so
# adding it to the certonly command above is sufficient — no separate Ansible
# task needed. Until this fix, every brand-new HTTP-01 lineage served a stale
# cert (bootstrap placeholder, or nothing) until the *next* scheduled renewal
# run happened to fire, hours or days later. Caught in production: AN-91's
# wiki.paxroleplay.com vhost issued a real cert successfully, but nginx kept
# serving the self-signed placeholder until manually reloaded.
- name: Remove the bootstrap placeholder before real issuance
  become: true
  ansible.builtin.file:
    path: "/etc/letsencrypt/live/{{ certbot_cert_name }}"
    state: absent
  when:
    - certbot_manage_certificates | bool
    - not ansible_check_mode
    - certbot_bootstrap_flag.stat.exists | default(false)

- name: Obtain certificate (skips once a real one exists)
  become: true
  ansible.builtin.command:
    cmd: "{{ certbot_certonly_cmd }}"
  register: certbot_issued
  changed_when: certbot_issued.rc == 0
  when:
    - certbot_manage_certificates | bool
    - not ansible_check_mode
    - (not certbot_existing_cert.stat.exists) or (certbot_bootstrap_flag.stat.exists | default(false))

- name: Clear the placeholder marker after a real issuance
  ansible.builtin.file:
    path: "/etc/letsencrypt/live/{{ certbot_cert_name }}/{{ certbot_bootstrap_marker }}"
    state: absent
  when:
    - certbot_manage_certificates | bool
    - not ansible_check_mode
    - certbot_issued is defined
    - certbot_issued is not skipped
    - certbot_issued.rc | default(1) == 0

# ---------- Auto-renewal timer ----------
- name: Install the certbot renewal service unit
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/certbot-renew.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Renew Let's Encrypt certificates via certbot
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart={{ certbot_bin }} renew --quiet{{ (' --deploy-hook ' + certbot_deploy_hook) if (certbot_deploy_hook | length > 0) else '' }}
  register: certbot_renew_service
  when: certbot_manage_renew_timer | bool

- name: Install the certbot renewal timer unit
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/certbot-renew.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Scheduled certbot renewal check

      [Timer]
      OnCalendar={{ certbot_renew_oncalendar }}
      RandomizedDelaySec={{ certbot_renew_randomized_delay_sec }}
      Persistent=true

      [Install]
      WantedBy=timers.target
  register: certbot_renew_timer
  when: certbot_manage_renew_timer | bool

- name: Enable and start the certbot renewal timer
  become: true
  ansible.builtin.systemd_service:
    name: certbot-renew.timer
    enabled: true
    state: started
    daemon_reload: "{{ certbot_renew_service.changed or certbot_renew_timer.changed }}"
  # In --check the copy tasks don't write the unit files, so systemd can't find
  # the timer to enable; skip only in check mode (a real run writes them first).
  when:
    - certbot_manage_renew_timer | bool
    - not ansible_check_mode
